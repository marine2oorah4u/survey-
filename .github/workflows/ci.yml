name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Survey math tests
        run: npm test
      - name: Install Chromium for the playthrough
        run: npx playwright install --with-deps chromium
      - name: Headless playthrough
        run: npm run test:play
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-screenshots
          path: screenshots/
          if-no-files-found: ignore
